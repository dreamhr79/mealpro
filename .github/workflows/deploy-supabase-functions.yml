name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mealpro-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: twslygxynuqxpatwjqqe
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.45.5
      - name: Apply database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all
      - name: Deploy catalog-sync
        run: supabase functions deploy catalog-sync --use-api --project-ref "$SUPABASE_PROJECT_ID"
