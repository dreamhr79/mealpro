name: Daily catalog sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/catalog_sync.py'
      - 'supabase/functions/catalog-sync/**'
      - '.github/workflows/catalog-sync.yml'
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: 'Comma-separated chains (blank = core set)'
        required: false
        default: ''

concurrency:
  group: mealpro-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import cijene.dev catalog
        env:
          CATALOG_SYNC_URL: ${{ secrets.CATALOG_SYNC_URL }}
          CATALOG_SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
          CHAINS: ${{ github.event.inputs.chains || 'konzum,lidl,spar,plodine,tommy,kaufland' }}
        run: |
          test -n "$CATALOG_SYNC_URL"
          test -n "$CATALOG_SYNC_TOKEN"
          python3 scripts/catalog_sync.py
