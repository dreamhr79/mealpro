name: Deploy MealPro Test

on:
  push:
    branches: [feat/recipes-phase-6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp app.html _site/index.html
          cp app.js db.js styles.css catalog-repository.js supabase-catalog-adapter.js config.js manifest.webmanifest sw.js _site/
          if [ -d icons ]; then cp -R icons _site/icons; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
