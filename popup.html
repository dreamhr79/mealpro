<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<style>
body{font:14px system-ui,-apple-system,sans-serif;width:290px;padding:16px;margin:0;background:#f8fafc;color:#172033}
h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.sub{color:#64748b;font-size:12px;margin-bottom:14px}
button{display:block;width:100%;padding:11px 14px;margin:8px 0;font-weight:700;font-size:13px;cursor:pointer;border:0;border-radius:10px;background:#17365d;color:#fff;transition:background 0.2s}
button:hover{background:#234a7d}
button.secondary{background:#edf2f7;color:#17365d}
button.secondary:hover{background:#e2e8f0}
.version{font-size:11px;color:#94a3b8;text-align:center;margin-top:12px}
</style>
</head>
<body>
<h3>🍽️ CijeneMeal Pro</h3>
<div class="sub">Kreator obroka, Dnevni plan & HR cjenici</div>
<button id="openApp">Otvori aplikaciju</button>
<button id="openIg" class="secondary">📥 Uvezi Instagram recept</button>
<div class="version">Verzija 3.1.3 · Integrirani motor</div>
<script src="popup.js"></script>
</body>
</html>
